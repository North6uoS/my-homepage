<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的个人主页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--glass:rgba(255,255,255,.15);--border:rgba(255,255,255,.3);--accent:#6366f1;--accent2:#818cf8}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2);color:#333;position:relative;overflow-x:hidden}
.bg{position:fixed;inset:0;background-size:cover;background-position:center;opacity:.6;z-index:-1;transition:opacity .3s}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(0,0,0,.8);color:#fff;padding:12px 24px;border-radius:8px;z-index:9999;opacity:0;transition:.3s;pointer-events:none;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%)}
.bg-set{position:fixed;top:16px;right:16px;z-index:1000;display:flex;gap:8px;align-items:center}
.bg-set button,.bg-set label{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:10px;padding:8px 14px;color:#fff;cursor:pointer;font-size:13px}
.bg-set input[type=range]{width:70px}
/* 管理员权限控制 */
body:not(.admin) .admin-only{display:none!important}
.container{max-width:1200px;margin:0 auto;padding:60px 20px 40px}
.view{display:none;animation:fade .4s}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:10px;padding:8px 16px;color:#fff;cursor:pointer;font-size:14px;margin-bottom:20px}
.page-title{color:#fff;font-size:26px;font-weight:600;margin-bottom:20px;text-shadow:0 2px 10px rgba(0,0,0,.2)}
/* 主页网格 */
.home-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr 1fr auto;gap:16px;grid-template-areas:"profile music" "works gallery" "works blog" "calendar calendar";min-height:80vh}
.card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:18px;padding:20px;cursor:pointer;transition:.3s;box-shadow:0 8px 32px rgba(0,0,0,.1);overflow:hidden;position:relative}
.card:hover{transform:translateY(-4px);background:rgba(255,255,255,.22)}
.card-profile{grid-area:profile}
.card-music{grid-area:music}
.card-works{grid-area:works}
.card-gallery{grid-area:gallery}
.card-blog{grid-area:blog}
.card-calendar{grid-area:calendar}
/* 自我介绍卡 */
.profile-card-inner{display:flex;gap:14px;height:100%}
.profile-avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.5);flex-shrink:0;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px}
.profile-right{flex:1;min-width:0;display:flex;flex-direction:column}
.profile-name{color:#fff;font-size:17px;font-weight:600;margin-bottom:4px}
.profile-bio{color:rgba(255,255,255,.75);font-size:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.profile-social{display:flex;gap:8px;margin-top:8px}
.social-icon{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;cursor:pointer;text-decoration:none;transition:.2s}
.social-icon:hover{background:rgba(255,255,255,.35)}
/* 音乐卡 */
.music-card-inner{display:flex;flex-direction:column;height:100%;gap:10px}
.music-top{display:flex;align-items:center;gap:12px}
.music-cover{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,#f093fb,#f5576c);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;flex-shrink:0;overflow:hidden}
.music-cover img{width:100%;height:100%;object-fit:cover}
.music-info{flex:1;min-width:0;overflow:hidden}
.music-name{color:#fff;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden}
.music-name.scroll{animation:scroll 14s linear infinite;animation-delay:2s}
.music-name.scroll:hover{animation-play-state:paused}
.music-name.scroll span{display:inline-block;padding-right:80px}
.music-artist{color:rgba(255,255,255,.6);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.music-progress{height:4px;background:rgba(255,255,255,.2);border-radius:2px;cursor:pointer;position:relative}
.music-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;width:0}
.music-bottom{display:flex;align-items:center;justify-content:space-between}
.music-ctrls{display:flex;gap:10px;align-items:center}
.music-btn{background:rgba(255,255,255,.2);border:none;width:30px;height:30px;border-radius:50%;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;padding:0}
.music-btn.play{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:16px;line-height:1}
.pause-bars{display:inline-flex;gap:3px;align-items:center;justify-content:center}
.pause-bars::before,.pause-bars::after{content:'';width:3px;height:14px;background:#fff;border-radius:2px}
.p-btn.play .pause-bars::before,.p-btn.play .pause-bars::after{width:4px;height:20px;gap:5px}
.music-vol{display:flex;align-items:center;gap:4px;color:#fff;font-size:12px}
.music-vol input{width:50px;cursor:pointer}
/* 作品卡 */
.works-card-inner{height:100%;display:flex;flex-direction:column}
.works-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;flex:1}
.work-thumb{aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.12);position:relative}
.work-thumb img{width:100%;height:100%;object-fit:cover}
.work-thumb-title{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:11px;padding:12px 8px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.work-empty{display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);font-size:12px;grid-column:span 2}
/* 图库卡 */
.gallery-card-inner{height:100%}
.gallery-thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;height:100%}
.gallery-thumb{aspect-ratio:1;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.12)}
.gallery-thumb img{width:100%;height:100%;object-fit:cover}
/* 日常卡 */
.blog-card-inner{height:100%;position:relative;border-radius:12px;overflow:hidden}
.blog-card-img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.blog-card-overlay{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.8));display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
.blog-card-date{color:rgba(255,255,255,.7);font-size:11px;margin-bottom:4px}
.blog-card-text{color:#fff;font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blog-card-noimg{color:rgba(255,255,255,.6);font-size:13px;text-align:center;padding:20px}
/* 日历卡 */
.calendar-card-inner{display:flex;align-items:center;gap:20px;height:100%}
.cal-left{display:flex;flex-direction:column;align-items:center;gap:4px}
.cal-date-row{display:flex;align-items:baseline;gap:6px}
.cal-month{color:rgba(255,255,255,.7);font-size:14px;font-weight:500}
.cal-day{color:#fff;font-size:36px;font-weight:700;line-height:1}
.cal-year{color:rgba(255,255,255,.6);font-size:13px}
.cal-weekday{writing-mode:vertical-rl;text-orientation:upright;color:rgba(255,255,255,.7);font-size:13px;letter-spacing:2px;margin-top:4px}
.cal-right{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;font-size:11px;color:rgba(255,255,255,.6);position:relative}
.cal-cell.today{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600;box-shadow:0 2px 10px rgba(99,102,241,.5)}
.cal-cell .mood{font-size:10px;line-height:1}
.cal-cell .star{position:absolute;top:1px;right:2px;font-size:8px}
/* 玻璃面板 */
.panel{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:0 8px 32px rgba(0,0,0,.1)}
/* 表单 */
.field{margin-bottom:14px;text-align:left}
.field label{display:block;color:rgba(255,255,255,.8);font-size:13px;margin-bottom:5px}
.field input,.field textarea{width:100%;padding:9px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;font-size:14px;outline:none;font-family:inherit}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field textarea:focus{border-color:var(--accent2)}
.field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,.4)}
.save-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:10px 28px;border-radius:10px;font-size:14px;cursor:pointer;transition:.3s}
.save-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(99,102,241,.4)}
/* 搜索 */
.toolbar{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;font-size:14px;outline:none}
.search input::placeholder{color:rgba(255,255,255,.4)}
.search::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px}
.add-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:9px 18px;border-radius:10px;font-size:13px;cursor:pointer;white-space:nowrap}
/* 作品详情 */
.works-list{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:768px){.works-list{grid-template-columns:1fr}.home-grid{grid-template-columns:1fr;grid-template-areas:"profile" "music" "works" "gallery" "blog" "calendar"}}
.work-card{background:rgba(255,255,255,.1);border-radius:14px;overflow:hidden;transition:.3s}
.work-card:hover{transform:translateY(-3px);background:rgba(255,255,255,.18)}
.work-cover{cursor:pointer;overflow:hidden;position:relative}
.work-cover.bili{aspect-ratio:16/9}
.work-cover.off{aspect-ratio:2.35/1}
.work-cover img{width:100%;height:100%;object-fit:cover;transition:.3s}
.work-card:hover .work-cover img{transform:scale(1.05)}
.work-cover-ph{width:100%;height:100%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
.work-info{padding:12px}
.work-title{color:#fff;font-size:14px;font-weight:500;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.work-row{display:flex;justify-content:space-between;align-items:center}
.work-link{color:#fff;text-decoration:none;background:rgba(255,255,255,.2);padding:5px 12px;border-radius:7px;font-size:12px}
.work-actions{display:flex;gap:4px}
.work-act-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:12px}
.work-act-btn:hover{background:rgba(255,255,255,.3)}
/* 图库详情 */
.tags-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;max-height:60px;overflow-y:auto}
.tag-chip{background:rgba(99,102,241,.3);color:#fff;padding:4px 10px;border-radius:6px;font-size:12px;cursor:pointer;transition:.2s}
.tag-chip:hover,.tag-chip.active{background:rgba(99,102,241,.6)}
.gallery-masonry{columns:4;column-gap:12px;min-height:200px}
@media(max-width:1024px){.gallery-masonry{columns:3}}
@media(max-width:640px){.gallery-masonry{columns:2}}
.gallery-item{break-inside:avoid;margin-bottom:12px;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden}
.gallery-item img{width:100%;display:block;cursor:pointer}
.gallery-item-info{padding:8px 10px}
.gallery-item-title{color:#fff;font-size:13px;margin-bottom:4px;display:flex;justify-content:space-between}
.gallery-del{color:rgba(255,255,255,.4);cursor:pointer;font-size:14px}
.gallery-del:hover{color:#ef4444}
.gallery-item-tags{display:flex;flex-wrap:wrap;gap:3px}
.gallery-item-tag{background:rgba(99,102,241,.3);color:rgba(255,255,255,.9);padding:1px 6px;border-radius:4px;font-size:10px}
/* 博客详情 */
.blog-list{display:flex;flex-direction:column;gap:14px}
.blog-item{background:rgba(255,255,255,.1);border-radius:14px;padding:18px;cursor:pointer;transition:.3s}
.blog-item:hover{background:rgba(255,255,255,.18)}
.blog-item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.blog-item-date{color:rgba(255,255,255,.6);font-size:12px}
.blog-item-del{color:rgba(255,255,255,.4);cursor:pointer;font-size:16px}
.blog-item-del:hover{color:#ef4444}
.blog-item-preview{color:rgba(255,255,255,.85);font-size:14px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.blog-item-full{color:rgba(255,255,255,.9);font-size:14px;line-height:1.7;white-space:pre-wrap}
.blog-item-img{margin-top:10px;border-radius:8px;max-width:100%;max-height:250px;object-fit:cover;cursor:pointer}
.blog-expand{color:var(--accent2);font-size:12px;margin-top:6px}
/* 日历详情 */
.cal-detail-wrap{background:rgba(255,255,255,.08);border-radius:14px;padding:20px}
.cal-detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.cal-nav-btn{background:rgba(255,255,255,.2);border:none;width:32px;height:32px;border-radius:8px;color:#fff;cursor:pointer;font-size:15px}
.cal-detail-title{color:#fff;font-size:18px;font-weight:600}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px}
.cal-wd{text-align:center;color:rgba(255,255,255,.5);font-size:12px;padding:6px 0}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-d-cell{aspect-ratio:1;background:rgba(255,255,255,.08);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:13px;position:relative;transition:.2s}
.cal-d-cell:hover{background:rgba(255,255,255,.18)}
.cal-d-cell.other{color:rgba(255,255,255,.3)}
.cal-d-cell.today{background:rgba(99,102,241,.4);font-weight:600}
.cal-d-cell.selected{background:rgba(99,102,241,.6)}
.cal-d-cell .d-mood{font-size:12px;line-height:1;margin-bottom:1px}
.cal-d-cell .d-star{position:absolute;top:3px;right:4px;font-size:9px}
.cal-day-detail{margin-top:18px;background:rgba(255,255,255,.08);border-radius:14px;padding:20px;display:none}
.cal-day-detail.show{display:block}
.cal-day-detail-title{color:#fff;font-size:16px;font-weight:600;margin-bottom:14px}
.mood-btns{display:flex;gap:10px;margin-bottom:18px}
.mood-btn{flex:1;padding:10px;border-radius:10px;border:2px solid transparent;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.2s}
.mood-btn:hover{background:rgba(255,255,255,.2)}
.mood-btn.active{border-color:var(--accent2)}
.mood-btn .emoji{font-size:20px}
.sched-input-row{display:flex;gap:8px;margin-bottom:12px}
.sched-input-row input{flex:1;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.15);color:#fff;font-size:13px;outline:none}
.sched-input-row input::placeholder{color:rgba(255,255,255,.4)}
.sched-add{padding:8px 16px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;cursor:pointer;font-size:13px}
.sched-list{display:flex;flex-direction:column;gap:6px}
.sched-item{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);padding:8px 12px;border-radius:8px;color:#fff;font-size:13px}
.sched-star{cursor:pointer;font-size:14px;opacity:.4}
.sched-star.on{opacity:1}
.sched-text{flex:1}
.sched-del{color:rgba(255,255,255,.4);cursor:pointer;font-size:14px}
.sched-del:hover{color:#ef4444}
.sched-empty{color:rgba(255,255,255,.4);font-size:13px;text-align:center;padding:10px}
/* 音乐详情 */
.music-detail{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:768px){.music-detail{grid-template-columns:1fr}}
.player-main{text-align:center}
.player-cover{width:200px;height:200px;border-radius:16px;margin:0 auto 18px;background:linear-gradient(135deg,#f093fb,#f5576c);display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px;overflow:hidden}
.player-cover img{width:100%;height:100%;object-fit:cover}
.player-title{color:#fff;font-size:20px;font-weight:600;margin-bottom:3px}
.player-artist{color:rgba(255,255,255,.65);font-size:13px;margin-bottom:18px}
.player-progress{margin-bottom:16px}
.player-track{width:100%;height:6px;background:rgba(255,255,255,.2);border-radius:3px;cursor:pointer;position:relative}
.player-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;width:0;position:relative}
.player-fill::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:10px;height:10px;background:#fff;border-radius:50%}
.player-time{display:flex;justify-content:space-between;color:rgba(255,255,255,.5);font-size:11px;margin-top:5px}
.player-ctrls{display:flex;justify-content:center;align-items:center;gap:20px;margin-bottom:16px}
.p-btn{background:rgba(255,255,255,.2);border:none;width:44px;height:44px;border-radius:50%;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;padding:0}
.p-btn.play{width:58px;height:58px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:22px;line-height:1}
.player-vol{display:flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-size:13px}
.player-vol input{width:100px}
.playlist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.playlist-title{color:#fff;font-size:16px;font-weight:600}
.import-btn{background:rgba(255,255,255,.2);border:1px solid var(--border);color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px}
.playlist{max-height:380px;overflow-y:auto}
.pl-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:.2s;margin-bottom:3px}
.pl-item:hover{background:rgba(255,255,255,.12)}
.pl-item.active{background:rgba(99,102,241,.3)}
.pl-cover{width:36px;height:36px;border-radius:7px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex-shrink:0;overflow:hidden}
.pl-cover img{width:100%;height:100%;object-fit:cover}
.pl-info{flex:1;min-width:0}
.pl-name{color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.pl-name:hover{text-decoration:underline}
.pl-artist{color:rgba(255,255,255,.5);font-size:11px}
.pl-actions{display:flex;gap:3px}
.pl-act{background:rgba(255,255,255,.1);border:none;color:#fff;width:24px;height:24px;border-radius:5px;cursor:pointer;font-size:11px;opacity:0;transition:.2s}
.pl-item:hover .pl-act{opacity:1}
.pl-act:hover{background:rgba(255,255,255,.25)}
.pl-empty{color:rgba(255,255,255,.5);text-align:center;padding:30px;font-size:13px}
/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-box{background:rgba(30,30,50,.95);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:24px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto;animation:min .3s}
@keyframes min{from{opacity:0;transform:scale(.95)}}
.modal-title{color:#fff;font-size:18px;font-weight:600;margin-bottom:16px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.m-btn{padding:9px 20px;border-radius:9px;border:none;cursor:pointer;font-size:13px}
.m-btn.cancel{background:rgba(255,255,255,.15);color:#fff}

<script>
// ===== GitHub 后端配置 =====
const GH_OWNER='North6uoS';
const GH_REPO='my-homepage';
const GH_PATH='data.json';
const GH_BRANCH='main';
const GH_API='https://api.github.com';
let isAdmin=false;
let ghToken='';
let ghFileSha='';
let ghDataCache=null;
// 需要同步的数据key
const SYNC_KEYS=['profile','works','gallery','blogs','calendar','bgImg','bgOp','songs'];
// GitHub API 封装
async function ghGetFile(){
  try{
    const url=`${GH_API}/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}?ref=${GH_BRANCH}`;
    const headers={'Accept':'application/vnd.github.v3+json'};
    if(ghToken)headers['Authorization']='token '+ghToken;
    const r=await fetch(url,{headers});
    if(r.status===404)return null;
    const j=await r.json();
    if(j.content){
      ghFileSha=j.sha;
      const content=decodeURIComponent(escape(atob(j.content.replace(/\s/g,''))));
      ghDataCache=JSON.parse(content);
      return ghDataCache;
    }
    return null;
  }catch(e){console.log('GitHub读取失败:',e);return null}
}
async function ghSetFile(data){
  if(!isAdmin||!ghToken)return false;
  try{
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    const body={message:'update homepage data',content:content,branch:GH_BRANCH};
    if(ghFileSha)body.sha=ghFileSha;
    const url=`${GH_API}/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;
    const r=await fetch(url,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'token '+ghToken,'Accept':'application/vnd.github.v3+json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(j.content&&j.content.sha){ghFileSha=j.content.sha;ghDataCache=data;return true}
    console.log('GitHub写入返回:',j);
    return false;
  }catch(e){console.log('GitHub写入失败:',e);return false}
}
// 把GitHub raw URL转换为GitHub Pages加速URL
function toGhPages(url){
  if(!url||typeof url!=='string'||!url.startsWith('http'))return url;
  const rawPrefix=`https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/`;
  const pagesPrefix=`https://${GH_OWNER}.github.io/${GH_REPO}/`;
  return url.replace(rawPrefix,pagesPrefix);
}
// 上传图片文件到GitHub仓库，返回GitHub Pages加速URL
async function ghUploadImage(folder, dataUrl){
  if(!isAdmin||!ghToken)return null;
  try{
    const ext=(dataUrl.match(/data:image\/(\w+)/)||[,])[1]||'png';
    const pureB64=dataUrl.includes(',')?dataUrl.split(',')[1]:dataUrl;
    const fname=folder+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+'.'+ext;
    const body={message:'upload '+fname,content:pureB64,branch:GH_BRANCH};
    const url=`${GH_API}/repos/${GH_OWNER}/${GH_REPO}/contents/${fname}`;
    const r=await fetch(url,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'token '+ghToken,'Accept':'application/vnd.github.v3+json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(j.content){
      // 返回GitHub Pages同域URL，比raw.githubusercontent.com快很多
      return `https://${GH_OWNER}.github.io/${GH_REPO}/${fname}`;
    }
    console.log('图片上传返回:',j);
    return null;
  }catch(e){console.log('图片上传失败:',e);return null}
}
async function ghVerifyToken(token){
  try{
    const r=await fetch(`${GH_API}/repos/${GH_OWNER}/${GH_REPO}`,{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}});
    if(r.status===200){const j=await r.json();return j.permissions&&j.permissions.push===true}
    return false;
  }catch(e){console.log('Token验证失败:',e);return false}
}
// 兼容原有接口
async function apiGet(key){
  if(ghDataCache&&ghDataCache[key]!==undefined)return ghDataCache[key];
  const data=await ghGetFile();
  if(data&&data[key]!==undefined)return data[key];
  return null;
}
async function apiSet(key,value){
  if(!isAdmin)return false;
  let data=ghDataCache||await ghGetFile()||{};
  data[key]=value;
  return await ghSetFile(data);
}
async function apiLogin(token){
  const ok=await ghVerifyToken(token);
  if(ok){ghToken=token;isAdmin=true;localStorage.setItem('ghToken',token);return true}
  return false;
}
function apiLogout(){isAdmin=false;ghToken='';ghDataCache=null;ghFileSha='';localStorage.removeItem('ghToken');updateAdminUI();toast('已退出管理员')}
function checkLocalToken(){const t=localStorage.getItem('ghToken');if(t){ghToken=t;isAdmin=true;return true}return false}
async function syncToBackend(key){if(!isAdmin)return;const v=get(key,null);if(v!==null){await apiSet(key,v)}}
async function loadFromBackend(){
  const data=await ghGetFile();
  if(!data)return;
  for(const k of SYNC_KEYS){if(data[k]!==undefined){localStorage.setItem(k,JSON.stringify(data[k]));console.log('已从GitHub加载:',k)}}
  if(data.calendar&&typeof data.calendar==='object'){for(const d in data.calendar){localStorage.setItem('cal_'+d,JSON.stringify(data.calendar[d]))}}
}
function saveCalendarToBackend(){
  if(!isAdmin)return;
  const cal={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('cal_')){try{cal[k.slice(4)]=JSON.parse(localStorage.getItem(k))}catch(e){}}}
  apiSet('calendar',cal);
}

function renderBlog(){const q=document.getElementById('blogSearch').value.toLowerCase();const list=blogs.filter(b=>!q||b.date.includes(q)||b.content.toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));
const c=document.getElementById('blogList');if(!list.length){c.innerHTML='<div class="empty"><div class="empty-icon">📝</div>暂无日常</div>';return}
c.innerHTML=list.map(b=>{const i=blogs.indexOf(b);const img=toGhPages(b.img);return '<div class="blog-item" onclick="toggleBlog('+i+',this)"><div class="blog-item-head"><span class="blog-item-date">'+b.date+'</span><span class="blog-item-del admin-only" onclick="event.stopPropagation();delBlog('+i+')">✕</span></div><div class="blog-item-preview">'+b.content.slice(0,100)+(b.content.length>100?'...':'')+'</div>'+(img?'<img class="blog-item-img" src="'+img+'" onclick="event.stopPropagation();openLightbox(\''+img+'\')">':'')+'</div>'}).join('')}
function toggleBlog(i,el){const b=blogs[i];const prev=el.querySelector('.blog-item-preview');if(prev){prev.classList.remove('blog-item-preview');prev.classList.add('blog-item-full');prev.textContent=b.content;const hint=document.createElement('div');hint.className='blog-expand';hint.textContent='点击收起';el.appendChild(hint)}else{const full=el.querySelector('.blog-item-full');full.classList.remove('blog-item-full');full.classList.add('blog-item-preview');full.textContent=b.content.slice(0,100)+(b.content.length>100?'...':'');el.querySelector('.blog-expand').remove()}}
function renderHomeBlog(){const c=document.getElementById('homeBlog');const latest=blogs.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];if(!latest){c.innerHTML='<div class="blog-card-noimg">暂无日常</div>';return}const img=toGhPages(latest.img);if(img){c.innerHTML='<img class="blog-card-img" src="'+img+'"><div class="blog-card-overlay"><div class="blog-card-date">'+latest.date+'</div><div class="blog-card-text">'+latest.content.slice(0,60)+'</div></div>'}else{c.innerHTML='<div class="blog-card-noimg" style="padding:20px"><div style="color:rgba(255,255,255,.6);font-size:12px;margin-bottom:6px">'+latest.date+'</div><div style="color:#fff;font-size:14px">'+latest.content.slice(0,80)+'</div></div>'}}
function openBlogModal(){blogImgData='';document.getElementById('blogDate').value=new Date().toISOString().slice(0,10);document.getElementById('blogContent').value='';document.getElementById('blogPrev').innerHTML='<span class="img-ph">未选择</span>';document.getElementById('blogImg').value='';openModal('blogModal')}
async function saveBlog(){const content=document.getElementById('blogContent').value.trim();if(!content){toast('请输入内容');return}const img=document.getElementById('blogPrev').querySelector('img');let imgUrl='';if(img){toast('上传中...');imgUrl=img.src;if(imgUrl.startsWith('data:')){imgUrl=await ghUploadImage('images/blogs',imgUrl);if(!imgUrl){toast('图片上传失败');return}}}blogs.unshift({id:fid(),date:document.getElementById('blogDate').value,content,img:imgUrl});set('blogs',blogs);renderBlog();renderHomeBlog();closeModal('blogModal');toast('已发布')}
function delBlog(i){blogs.splice(i,1);set('blogs',blogs);renderBlog();renderHomeBlog()}
// 日历
let calYear,calMonth,selDate='';
const moodEmoji={happy:'😊',neutral:'😐',sad:'😢'};
function loadCal(){const now=new Date();calYear=now.getFullYear();calMonth=now.getMonth();selDate=fmtDate(now)}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function renderCal(){document.getElementById('calTitle').textContent=calYear+'年'+(calMonth+1)+'月';const first=new Date(calYear,calMonth,1);const startDay=first.getDay();const daysInMonth=new Date(calYear,calMonth+1,0).getDate();const prevDays=new Date(calYear,calMonth,0).getDate();const today=fmtDate(new Date());let html='';
for(let i=0;i<startDay;i++){const d=prevDays-startDay+1+i;html+='<div class="cal-d-cell other">'+d+'</div>'}
for(let d=1;d<=daysInMonth;d++){const date=calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');const data=get('cal_'+date,{mood:'',scheds:[]});const isToday=date===today,isSel=date===selDate;const star=data.scheds&&data.scheds.some(s=>s.star);html+='<div class="cal-d-cell '+(isToday?'today':'')+' '+(isSel?'selected':'')+'" onclick="selectDate(\''+date+'\')">'+(data.mood?'<span class="d-mood">'+moodEmoji[data.mood]+'</span>':'')+'<span>'+d+'</span>'+(star?'<span class="d-star">⭐</span>':'')+'</div>'}
const total=startDay+daysInMonth;const rem=(7-total%7)%7;for(let i=1;i<=rem;i++)html+='<div class="cal-d-cell other">'+i+'</div>';
document.getElementById('calDays').innerHTML=html;renderHomeCal()}
function changeMonth(d){calMonth+=d;if(calMonth<0){calMonth=11;calYear--}if(calMonth>11){calMonth=0;calYear++}renderCal()}
function selectDate(date){selDate=date;renderCal();showDayDetail()}
function showDayDetail(){const data=get('cal_'+selDate,{mood:'',scheds:[]});const el=document.getElementById('calDayDetail');el.classList.add('show');document.getElementById('calDayTitle').textContent=selDate+' 详情';
document.querySelectorAll('.mood-btn').forEach(b=>b.classList.toggle('active',b.dataset.mood===data.mood));
const list=document.getElementById('schedList');if(!data.scheds.length){list.innerHTML='<div class="sched-empty">暂无日程</div>'}else{list.innerHTML=data.scheds.map((s,i)=>'<div class="sched-item"><span class="sched-star admin-only '+(s.star?'on':'')+'" onclick="toggleStar('+i+')">⭐</span><span class="sched-text">'+s.text+'</span><span class="sched-del admin-only" onclick="delSched('+i+')">✕</span></div>').join('')}
}
function setMood(m){const data=get('cal_'+selDate,{mood:'',scheds:[]});data.mood=data.mood===m?'':m;set('cal_'+selDate,data);showDayDetail();renderCal()}
function addSched(){const inp=document.getElementById('schedInput');const text=inp.value.trim();if(!text)return;const data=get('cal_'+selDate,{mood:'',scheds:[]});data.scheds.push({text,star:false});set('cal_'+selDate,data);inp.value='';showDayDetail();renderCal()}
function toggleStar(i){const data=get('cal_'+selDate,{mood:'',scheds:[]});data.scheds[i].star=!data.scheds[i].star;set('cal_'+selDate,data);showDayDetail();renderCal()}
function delSched(i){const data=get('cal_'+selDate,{mood:'',scheds:[]});data.scheds.splice(i,1);set('cal_'+selDate,data);showDayDetail();renderCal()}
function renderHomeCal(){const now=new Date();const y=now.getFullYear(),m=now.getMonth()+1,d=now.getDate();const wd=['日','一','二','三','四','五','六'][now.getDay()];
document.getElementById('homeYear').textContent=y;document.getElementById('homeMonth').textContent=m+'月';document.getElementById('homeDay').textContent=d;document.getElementById('homeWeekday').textContent='星期'+wd;
// 本周7天
const start=new Date(now);start.setDate(now.getDate()-now.getDay());const today=fmtDate(now);let html='';
for(let i=0;i<7;i++){const day=new Date(start);day.setDate(start.getDate()+i);const date=fmtDate(day);const data=get('cal_'+date,{mood:'',scheds:[]});const isToday=date===today;const star=data.scheds.some(s=>s.star);html+='<div class="cal-cell '+(isToday?'today':'')+'">'+(data.mood?'<span class="mood">'+moodEmoji[data.mood]+'</span>':'')+'<span>'+day.getDate()+'</span>'+(star?'<span class="star">⭐</span>':'')+'</div>'}
document.getElementById('homeWeek').innerHTML=html}
// 弹窗
function openModal(id){document.getElementById(id).classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function previewImg(input,prevId){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById(prevId).innerHTML='<img src="'+r.result+'">'};r.readAsDataURL(f)}
// 灯箱
function openLightbox(src){document.getElementById('lbImg').src=src;document.getElementById('lightbox').classList.add('show')}
function closeLightbox(){document.getElementById('lightbox').classList.remove('show')}
// 刷新主页
function refreshHome(){loadProfile();updatePlayer();renderHomeWorks();renderHomeGallery();renderHomeBlog();renderHomeCal()}
// 初始化
async function initApp(){
  try{
    checkLocalToken();
    updateAdminUI();
    await loadFromBackend();
  }catch(e){console.log('后端加载失败:',e)}
  try{initBg()}catch(e){console.log('背景初始化失败:',e)}
  try{loadProfile()}catch(e){console.log('个人资料初始化失败:',e)}
  try{loadSongs()}catch(e){console.log('音乐初始化失败:',e)}
  try{loadWorks()}catch(e){console.log('作品初始化失败:',e)}
  try{loadGallery()}catch(e){console.log('图库初始化失败:',e)}
  try{loadBlog()}catch(e){console.log('日常初始化失败:',e)}
  try{loadCal();renderHomeCal()}catch(e){console.log('日历初始化失败:',e)}
  audio.volume=.8;
  const av=document.getElementById('homeAvatar');
  if(av)av.addEventListener('click',onAvatarClick);
  const pAv=document.getElementById('pAvatar');
  if(pAv)pAv.addEventListener('click',onAvatarClick);
  toast('数据已同步');
}
initApp();
</script>
